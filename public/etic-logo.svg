<svg xmlns="http://www.w3.org/2000/svg" width="620" height="170" viewBox="0 0 620 170" role="img" aria-labelledby="title desc">
  <title id="title">ETIC</title>
  <desc id="desc">Logotipo tridimensional ETIC — Estrategia, Tecnología, Información y Consultoría</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".48" stop-color="#d8fbff"/>
      <stop offset="1" stop-color="#62dce8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27d4df"/>
      <stop offset="1" stop-color="#087490"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#061b38" flood-opacity=".42"/>
    </filter>
  </defs>
  <g transform="translate(18 18)" filter="url(#soft-shadow)" font-family="Inter, Arial, sans-serif" font-weight="900" font-style="italic">
    <!-- dimensional extrusion -->
    <text x="9" y="93" font-size="91" letter-spacing="4" fill="#063657" stroke="#063657" stroke-width="9" stroke-linejoin="round">ETIC</text>
    <text x="6" y="87" font-size="91" letter-spacing="4" fill="url(#edge)" stroke="#08345b" stroke-width="7" stroke-linejoin="round">ETIC</text>
    <!-- illuminated front face -->
    <text x="0" y="78" font-size="91" letter-spacing="4" fill="url(#face)" stroke="#f4ffff" stroke-width="2" paint-order="stroke">ETIC</text>
    <!-- signature highlight -->
    <path d="M7 101h245" stroke="#23cbd8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="269" cy="101" r="3.5" fill="#23cbd8"/>
  </g>
  <g transform="translate(30 146)" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#d5faff">
    <text>ESTRATEGIA · TECNOLOGÍA · INFORMACIÓN · CONSULTORÍA</text>
  </g>
</svg>
